name: WidgetApp
options:
  bundleIdPrefix: com.alpsenel
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: 6S7Q8F967Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  VocabCore:
    path: Packages/VocabCore
targets:
  WidgetApp:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: VocabCore
      - target: WidgetAppWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpsenel.wordwidget
        PRODUCT_NAME: WidgetApp
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/WidgetApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  WidgetAppWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget/Sources
      - path: Widget/Resources
        buildPhase: resources
        optional: true
    dependencies:
      - package: VocabCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpsenel.wordwidget.widget
        PRODUCT_NAME: WidgetAppWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/WidgetAppWidget.entitlements
        SKIP_INSTALL: true
schemes:
  WidgetAppWidget:
    build:
      targets:
        WidgetAppWidget: all
        WidgetApp: all
    run:
      config: Debug
      executable: WidgetApp
      launchAutomaticallySubstyle: 2
      environmentVariables:
        _XCWidgetKind: VocabiWordWidget
        _XCWidgetDefaultView: timeline
        _XCWidgetFamily: medium
  WidgetApp:
    build:
      targets:
        WidgetApp: all
        WidgetAppWidget: all
    run:
      config: Debug
      storeKitConfiguration: App/Vocabi.storekit
    test:
      config: Debug
      targets:
        - package: VocabCore/VocabCoreTests
